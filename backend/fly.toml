# Fly.io deployment for the TafakkurAI API.
#
# Secrets (DATABASE_URL, JWT_SECRET, S3 keys, ...) are NOT in this file — set
# them with `fly secrets set`. See DEPLOY.md.

app = "tafakkur-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "prod"
  HTTP_PORT = "8080"
  # The Dockerfile copies migrations to /app/migrations; the API auto-applies
  # them on boot.
  MIGRATIONS_DIR = "/app/migrations"
  S3_REGION = "auto"
  S3_BUCKET = "tafakkur-media"
  S3_USE_PATH_STYLE = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # The whole point of paying for Fly instead of a free tier: the machine stays
  # up, so there is no cold start on the first request.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
