name: tafakkur-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=50
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      # Force TCP so this cannot succeed against the image's temporary
      # Unix-socket-only server while initdb scripts are still running.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 1m
    shm_size: 256m
    mem_limit: 4g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate:
    image: tafakkur-api:production
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env.production}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env.production}
      MIGRATIONS_DIR: /app/migrations
    networks:
      - database
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    logging: *default-logging

  api:
    image: tafakkur-api:production
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ENV: production
      PORT: "8080"
      HEALTHCHECK_PATH: /ready
      DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      AUTO_MIGRATE: "false"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.production}
      JWT_ISSUER: ${JWT_ISSUER:-tafakkur}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      PUBLIC_BASE_URL: https://${API_DOMAIN:?set API_DOMAIN in .env.production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      OAUTH_STATE_TTL: ${OAUTH_STATE_TTL:-10m}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      OTP_TTL: ${OTP_TTL:-5m}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_BASE: ${TELEGRAM_WEBHOOK_BASE:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_CODE_TTL: ${TELEGRAM_CODE_TTL:-5m}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5}
      CLAUDE_DEEP_MODEL: ${CLAUDE_DEEP_MODEL:-claude-opus-4-8}
      CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-1024}
      ANTHROPIC_VERSION: ${ANTHROPIC_VERSION:-2023-06-01}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-me-jeddah-1}
      S3_BUCKET: ${S3_BUCKET:-tafakkur-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
      S3_PUBLIC_BASE: ${S3_PUBLIC_BASE:-}
      RATE_AUTH_PER_MIN: ${RATE_AUTH_PER_MIN:-20}
      RATE_COACH_PER_MIN: ${RATE_COACH_PER_MIN:-15}
      RATE_POST_PER_MIN: ${RATE_POST_PER_MIN:-30}
      RATE_SYNC_PER_MIN: ${RATE_SYNC_PER_MIN:-20}
    networks:
      - proxy
      - database
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: 2g
    pids_limit: 256
    logging: *default-logging

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    logging: *default-logging

networks:
  proxy:
    driver: bridge
  database:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
